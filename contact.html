<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Contact Us | Paws & Hearts</title>
  <link rel="stylesheet" href="./contact/contact.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
</head>
<body>
  
  <header>
    <div class="logo-container">
      <img src="./pawpet.png" alt="Paw Icon">
      <span>Paws & Hearts</span>
    </div>
    <nav>
      <a href="home.html">Home</a>
      <a href="about.html">About Us</a></li>
      <a href="index.html">Find a Pet</a></li>
      </div>
      <a href="contact.html">Contact</a>
      <button class="theme-toggle" id="themeToggle">
        <i class="fas fa-moon"></i>
      </button>
      <a href="indexfile.html" class="btn btn-primary">Adopt Now</a>
    </nav>
  </header>
  <p id="image">
    <img src="./contactimage.svg" height="35%" style="text-align: center;">
    </p>
  <main>
    <div class="contact-container">
      <h1>Contact Us</h1>
      <p>If you have any questions, feel free to reach out. We’d love to hear from you!</p>
      <form id="contactForm">
        <input type="text" name="name" placeholder="Your Name" required />
        <input type="email" name="email" placeholder="Your Email" required />
        <input type="text" name="subject" placeholder="Subject" required />
        <textarea name="message" placeholder="Your Message" required></textarea>
        <button type="submit">Send Message</button>
      </form>
    </div>
  </main>
  <script src="./contact/contact.js"></script>
</body>
</html>
